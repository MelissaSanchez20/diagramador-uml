# Despliegue del Diagramador UML en un solo servidor (EC2) -- ver DESPLIEGUE.md.
#
#   Internet --443/80--> web (Caddy: HTTPS + frontend) --/api--> backend (FastAPI) --> db (PostgreSQL)
#
# Las variables (${...}) salen del archivo .env de esta misma carpeta
# (copiado de .env.produccion.example). Solo "web" expone puertos: la base de
# datos y el backend no son accesibles desde internet.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PROJECT_NAME: Diagramador UML
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: https://${DOMINIO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
    # UNA sola réplica y un solo worker (ver backend/docker-entrypoint.sh):
    # las salas de colaboración en tiempo real viven en memoria.

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificados HTTPS: si se pierden, Caddy pide uno nuevo en cada
      # arranque y Let's Encrypt limita cuántos se pueden pedir por semana.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
